[project]
name = "document-extractor"
version = "0.1.0"
description = "Local document extraction with PaddleOCR-VL and optional Docling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle==3.2.2; sys_platform != 'darwin'",
    "paddlepaddle==3.2.1; sys_platform == 'darwin'",
    "typer>=0.19,<0.27",
    "python-dotenv>=1.2,<2",
    "rich>=14,<16",
    "pypdfium2>=4,<6",
]

[project.optional-dependencies]
docling = ["docling>=2.80,<3"]
mlx = ["mlx-vlm>=0.3.11; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
doc-extract = "document_extractor.cli:main"
document-extractor = "document_extractor.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
